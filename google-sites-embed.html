<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PolyTrack embed</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 480px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://cdn.jsdelivr.net/gh/568814-design/Polytrack-0.6.0@main/index.html"
      title="PolyTrack"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen
      loading="eager"
      referrerpolicy="no-referrer"
    ></iframe>
  </body>
</html>
